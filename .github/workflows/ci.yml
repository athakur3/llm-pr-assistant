name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: test / typecheck / build / package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 23.6+ is required: the test suite runs on Node's built-in test
      # runner with native TypeScript type stripping (see CONTRIBUTING.md).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package
        run: npx vsce package
